<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120b18">
  <meta name="description" content="Nene's Divaloper GitHub Statistics — contributions, repositories, commits, languages and development activity.">
  <title>Nene's Divaloper GitHub Statistics</title>

  <style>
    :root {
      --bg: #120b18;
      --panel: #201329;
      --panel-light: #2b1936;
      --pink: #ff1493;
      --pink-light: #ff72bd;
      --text: #fff5fc;
      --muted: #bba8c5;
      --border: #42294e;
      --green: #82edb0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 10% 0%, #48204d 0, transparent 36%),
        radial-gradient(ellipse at 95% 20%, #35122e 0, transparent 30%),
        var(--bg);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }

    button, a {
      font: inherit;
    }

    a {
      color: var(--pink-light);
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--pink-light);
      outline-offset: 4px;
    }

    .container {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      padding: 26px 0;
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 800;
      letter-spacing: -0.5px;
      overflow-wrap: anywhere;
    }

    .brand span,
    footer span {
      color: var(--pink-light);
    }

    main {
      padding: 40px 0 60px;
    }

    .profile-section {
      display: flex;
      justify-content: center;
      margin-bottom: 42px;
    }

    .profile {
      display: flex;
      flex-direction: column;
      width: min(100%, 760px);
      min-width: 0;
      padding: 24px 30px;
      background: #201329bb;
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .profile-top {
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr);
      align-items: center;
      column-gap: 24px;
      min-width: 0;
    }

    .avatar {
      display: block;
      width: 94px;
      height: 94px;
      border-radius: 50%;
      border: 3px solid var(--pink);
      object-fit: cover;
      background: var(--panel-light);
      justify-self: center;
    }

    .profile-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 2px;
    }

    .profile-name {
      margin: 0;
      width: 100%;
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .muted {
      color: var(--muted);
      font-size: 0.88rem;
    }

    #profile-login {
      overflow-wrap: anywhere;
    }

    .github-link {
      display: inline-block;
      text-decoration: none;
      border: 1px solid var(--pink);
      border-radius: 999px;
      padding: 9px 18px;
      color: var(--text);
      background: #201329;
      font-size: 0.85rem;
      font-weight: 700;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }

    .github-link:hover {
      border-color: var(--pink-light);
      background: var(--pink);
      color: white;
      transform: translateY(-1px);
    }

    .profile-button {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 18px auto 0;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .hero {
      margin-bottom: 35px;
    }

    .eyebrow {
      color: var(--pink-light);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.1rem, 5vw, 3.7rem);
      line-height: 1.1;
      letter-spacing: -2px;
      margin: 10px 0 14px;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .intro {
      max-width: 680px;
      color: var(--muted);
      margin: 0 0 16px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--green);
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
      margin: 32px 0 16px;
    }

    h2 {
      margin: 0;
      font-size: 1.35rem;
    }

    .section-note {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }

    .stat-card {
      display: block;
      width: 100%;
      min-width: 0;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      padding: 21px;
      border-radius: 17px;
      border: 1px solid var(--border);
      background: linear-gradient(145deg, #291834, #1b1023);
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
    }

    .stat-card:hover,
    .stat-card.active {
      border-color: var(--pink);
      background: linear-gradient(145deg, #3a1c40, #21112b);
      transform: translateY(-2px);
    }

    .stat-icon {
      font-size: 1.35rem;
    }

    .stat-value {
      display: block;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      line-height: 1.25;
      font-weight: 850;
      margin: 12px 0 5px;
      overflow-wrap: anywhere;
    }

    .stat-label {
